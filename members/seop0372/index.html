<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 명언</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  }

  #quote {
    font-size: 1.3rem;
    line-height: 1.6;
    color: #333;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #author {
    margin-top: 12px;
    font-size: 0.95rem;
    color: #888;
  }

  button {
    margin-top: 24px;
    padding: 12px 28px;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    background: #8b5cf6;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  button:hover {
    background: #7c3aed;
  }

  button:active {
    transform: scale(0.96);
  }
</style>
</head>
<body>

<div class="card">
  <div id="quote">버튼을 눌러 명언을 확인하세요.</div>
  <div id="author"></div>
  <button onclick="showRandomQuote()">명언 보기</button>
</div>

<script>
  const quotes = [
    { text: "성공은 최종적인 것이 아니고, 실패는 치명적인 것이 아니다. 중요한 것은 계속하는 용기다.", author: "윈스턴 처칠" },
    { text: "삶이 있는 한 희망은 있다.", author: "키케로" },
    { text: "네가 할 수 있다고 믿든 할 수 없다고 믿든, 믿는 대로 될 것이다.", author: "헨리 포드" },
    { text: "오늘 할 수 있는 일에 전력을 다하라. 그러면 내일은 한 걸음 더 진보한다.", author: "아이작 뉴턴" },
    { text: "행복은 습관이다. 그것을 몸에 지니라.", author: "허버드" },
    { text: "실패를 두려워하지 말라. 실패하지 않는 것보다 도전하지 않는 것을 두려워하라.", author: "작자 미상" },
    { text: "가장 큰 위험은 위험 없는 삶을 사는 것이다.", author: "작자 미상" },
    { text: "천 리 길도 한 걸음부터.", author: "속담" },
  ];

  function showRandomQuote() {
    const random = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById("quote").textContent = random.text;
    document.getElementById("author").textContent = "- " + random.author;
  }
</script>

</body>
</html>
